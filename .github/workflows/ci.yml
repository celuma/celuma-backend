name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker-build-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # OIDC for AWS

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW: AWS OIDC + ECR login ---
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECRPushRole
          aws-region: mx-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # -----------------------------------

      - name: Build and push Docker image (main branch → GHCR + ECR STG)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CELUMA_VERSION=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref=${{ github.ref }}
            org.opencontainers.image.title=Main-Branch-Image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output main branch image reference
        run: |
          echo "### 🚀 Main Branch Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GHCR tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:main" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECR (stg) tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-latest" >> $GITHUB_STEP_SUMMARY

  deploy-stg:
    needs: docker-build-main
    runs-on: ubuntu-latest
    # Céluma 1.3 Phase 5, Block G-D — F-004.
    #
    # There is no staging environment: no `celuma-stg` ECS cluster, no staging
    # RDS instance, no staging S3 bucket and no staging CloudFront
    # distribution. This job therefore failed on every push to main — the
    # backend with `AccessDeniedException` on `ecs:UpdateService` (IAM denies
    # before the missing resource is even resolved), the frontend with
    # "Could not find stg CloudFront distribution".
    #
    # A permanently red job is worse than an absent one: it trains everyone to
    # ignore the signal, which is how a real regression eventually gets missed.
    #
    # The job is GATED rather than deleted, so the deployment recipe survives
    # for the day staging actually exists. To re-enable, provision the
    # environment and set the repository variable CELUMA_STG_ENABLED=true.
    #
    # Pre-production validation for 1.3 is covered by the isolated
    # release-validation stack (D-004), which runs the real browser E2E suite
    # against real Chromium PDF generation at $0/month.
    # See docs/celuma-1.3/phase-5-block-g/block-g-staging-decision.md
    if: >-
      vars.CELUMA_STG_ENABLED == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: stg

    permissions:
      id-token: write   # OIDC for AWS
      contents: read

    steps:
      - name: Configure AWS (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECSDeployRole
          aws-region: mx-central-1

      - name: Force new ECS deployment (stg)
        run: |
          aws ecs update-service \
            --cluster celuma-stg \
            --service celuma-stg-backend \
            --force-new-deployment \
            --no-cli-pager > /dev/null
          echo "Triggered rolling deploy for celuma-stg-backend"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster celuma-stg \
            --services celuma-stg-backend
          echo "### ✅ Backend deployed to stg (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

  docker-release:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # OIDC para AWS

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR (igual que ya tenías)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- NUEVO: AWS OIDC + login ECR ---
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECRPushRole
          aws-region: mx-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # -----------------------------------

      - name: Extract release version
        id: release_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV

      - name: Build and push Docker image (tag → GHCR + ECR PROD)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CELUMA_VERSION=${{ github.ref_name }}
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ steps.release_version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:${{ steps.release_version.outputs.version }}
            ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref=${{ github.ref }}
            org.opencontainers.image.title=Release-${{ github.ref_name }}
            org.opencontainers.image.version=${{ steps.release_version.outputs.version }}

      - name: Output release image reference
        run: |
          echo "### 🎉 Release Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GHCR tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ steps.release_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECR (prod) tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:${{ steps.release_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma/celuma-backend:latest" >> $GITHUB_STEP_SUMMARY

  deploy-prod:
    needs: docker-release
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: prod
      url: https://app.celuma.mx/api

    permissions:
      id-token: write   # OIDC for AWS
      contents: read

    steps:
      - name: Configure AWS (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECSDeployRole
          aws-region: mx-central-1

      - name: Force new ECS deployment (prod)
        run: |
          aws ecs update-service \
            --cluster celuma-prod \
            --service celuma-prod-backend \
            --force-new-deployment \
            --no-cli-pager > /dev/null
          echo "Triggered rolling deploy for celuma-prod-backend"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster celuma-prod \
            --services celuma-prod-backend
          echo "### ✅ Backend deployed to prod (${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
