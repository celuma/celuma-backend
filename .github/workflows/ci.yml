name: ci

# Céluma 1.3 Phase 5, Block G-E — G-001.
#
# The `tags: v*` trigger was REMOVED. Creating a release tag used to rebuild the
# image with --no-cache, push it over `v1.3.0`/`1.3.0`/**latest** — the tag the
# running service pulls — and then force a production ECS deployment, with no
# human gate (both repositories' `prod` GitHub Environment has no protection
# rules). Tagging a commit and shipping it to patients were the same act.
#
# A release tag must be a record of what was already released, not the thing
# that releases it. With no tag trigger, creating `v1.3.0` starts nothing.
#
# The 1.3 release mechanics that replace it:
#   * the ARTIFACT is built by rc.yml (workflow_dispatch, exact SHA, ECR-push
#     credentials only) and is identified by its immutable digest;
#   * the DEPLOYMENT is a reviewed `cdk deploy CelumaProdBackend`, which is the
#     only mechanism that can deliver the 1.3 task definition at all — it needs
#     the digest pin plus PDF_GENERATOR_BASE_URL, CORS_ALLOWED_ORIGINS,
#     FORWARDED_ALLOW_IPS, RUN_MIGRATIONS_ON_START and the EMAIL_* settings,
#     none of which `aws ecs update-service --force-new-deployment` can add;
#   * the MIGRATION is a separate controlled one-off task.
#
# See docs/celuma-1.3/phase-5-block-g/block-g-deployment-review.md
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # OIDC for AWS

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW: AWS OIDC + ECR login ---
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECRPushRole
          aws-region: mx-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # -----------------------------------

      - name: Build and push Docker image (main branch → GHCR + ECR STG)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CELUMA_VERSION=${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:latest
            ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref=${{ github.ref }}
            org.opencontainers.image.title=Main-Branch-Image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output main branch image reference
        run: |
          echo "### 🚀 Main Branch Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GHCR tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:main" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ECR (stg) tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.login-ecr.outputs.registry }}/celuma-stg/celuma-backend:stg-latest" >> $GITHUB_STEP_SUMMARY

  deploy-stg:
    needs: docker-build-main
    runs-on: ubuntu-latest
    # Céluma 1.3 Phase 5, Block G-D — F-004.
    #
    # There is no staging environment: no `celuma-stg` ECS cluster, no staging
    # RDS instance, no staging S3 bucket and no staging CloudFront
    # distribution. This job therefore failed on every push to main — the
    # backend with `AccessDeniedException` on `ecs:UpdateService` (IAM denies
    # before the missing resource is even resolved), the frontend with
    # "Could not find stg CloudFront distribution".
    #
    # A permanently red job is worse than an absent one: it trains everyone to
    # ignore the signal, which is how a real regression eventually gets missed.
    #
    # The job is GATED rather than deleted, so the deployment recipe survives
    # for the day staging actually exists. To re-enable, provision the
    # environment and set the repository variable CELUMA_STG_ENABLED=true.
    #
    # Pre-production validation for 1.3 is covered by the isolated
    # release-validation stack (D-004), which runs the real browser E2E suite
    # against real Chromium PDF generation at $0/month.
    # See docs/celuma-1.3/phase-5-block-g/block-g-staging-decision.md
    if: >-
      vars.CELUMA_STG_ENABLED == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: stg

    permissions:
      id-token: write   # OIDC for AWS
      contents: read

    steps:
      - name: Configure AWS (OIDC, deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::385511156241:role/GitHubActionsECSDeployRole
          aws-region: mx-central-1

      - name: Force new ECS deployment (stg)
        run: |
          aws ecs update-service \
            --cluster celuma-stg \
            --service celuma-stg-backend \
            --force-new-deployment \
            --no-cli-pager > /dev/null
          echo "Triggered rolling deploy for celuma-stg-backend"

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster celuma-stg \
            --services celuma-stg-backend
          echo "### ✅ Backend deployed to stg (${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
