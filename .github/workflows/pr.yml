name: pr

on:
  pull_request:
    branches:
      - main
      - celuma-1.3

permissions:
  contents: read

# Prevents duplicate builds from multiple pushes on the same PR
concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: celuma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d celuma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/celuma_test
      JWT_SECRET: ci-only-secret-not-used-outside-tests
      JWT_EXPIRES_MIN: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # install-dev, not install: since the Céluma 1.3 Phase 2 closure,
      # requirements.txt is runtime-only so the production image ships no
      # test tooling. pytest/httpx live in requirements-dev.txt.
      - name: Install dependencies
        run: make install-dev
        shell: bash

      - name: Lint
        run: make lint
        shell: bash
      
      - name: Run unit tests
        run: make test-unit
        shell: bash

  docker-pr-build:
    runs-on: ubuntu-latest
    needs: test
    # Only runs if tests passed
    if: >-
      needs.test.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always build and push for testing
      - name: Build & Push Docker image for PR testing
        id: buildpush
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            CELUMA_VERSION=pr-${{ github.event.number }}-${{ github.sha }}
          push: true
          platforms: linux/amd64,linux/arm64
          # PR tags for testing
          tags: |
            ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref=${{ github.ref }}
            org.opencontainers.image.title=PR-${{ github.event.number }}-Test-Image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Output in job summary which tag to use for testing the image
      - name: Output image reference
        run: |
          echo "### 🐳 PR Docker Image for Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Use these tags to test the PR code:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker run command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8000:8000 ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
