services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: celumadb
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    # `dev` target: runtime image + pytest/httpx, so `docker compose exec api
    # pytest` works locally. CI builds with no --target and gets `runtime`,
    # which ships no test tooling. See
    # docs/celuma-1.3/phase-2-closure/backend-image-size-analysis.md.
    build:
      context: .
      target: dev
    env_file: .env
    command: bash start.sh
    volumes:
      - .:/app
    ports: ["8000:8000"]
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/celumadb}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_MIN=${JWT_EXPIRES_MIN:-480}
      - APP_NAME=${APP_NAME:-celuma}
      - ENV=${ENV:-dev}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL}
      - MEDIA_PRESIGNED_EXPIRE_SECONDS=${MEDIA_PRESIGNED_EXPIRE_SECONDS:-3600}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      # Céluma 1.3 Phase 3, Block E: notification email delivery. Every one of
      # these already reaches the container through `env_file: .env`; they are
      # listed explicitly so a developer can override one per-shell
      # (`EMAIL_PROVIDER=fake docker compose up`) without editing .env, which
      # is how the local validation in this block drove the worker.
      #
      # EMAIL_ENABLED defaults to false: no worker starts and nothing is sent
      # unless an environment opts in.
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-ses}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_SENDER_NAME=${EMAIL_SENDER_NAME:-Céluma}
      - EMAIL_SES_REGION=${EMAIL_SES_REGION}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DELIVERY_POLL_INTERVAL_SECONDS=${DELIVERY_POLL_INTERVAL_SECONDS:-10}

volumes:
  pgdata:
